workflows:
  ios-testflight:
    name: Budder Buddy iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Admin-access key (App Store Connect key "magiccode", Key ID
      # BHNKDRCGAP). Originally registered in Codemagic as "budder buddy
      # api" - that name never resolved for the integrations: lookup
      # ("does not exist"), while a space-free name ("codemagic") did in a
      # diagnostic run, so it was re-added here under a space-free name.
      app_store_connect: budder_buddy_admin
    environment:
      # Create this group under the app's Environment variables in Codemagic
      # and add VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY to it
      # (values from this repo's .env - they're the public/anon keys, safe
      # to build in, but keeping them out of this committed file anyway).
      groups:
        - budder_buddy_env
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcodeproj/project.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bluedreambudder.budder-buddy"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Re-add GoogleSignIn to regenerated Package.swift
        # `cap sync` fully regenerates ios/App/CapApp-SPM/Package.swift from
        # the installed npm Capacitor plugins only. GoogleSignIn-iOS was
        # added by hand (native Google sign-in used by SocialAuthPlugin.swift,
        # not an npm Capacitor plugin), so cap sync silently drops it on
        # every single build - archive then fails with "unable to resolve
        # module dependency: 'GoogleSignIn'". Patches it back in after sync;
        # idempotent (no-op if already present).
        script: |
          PKG="ios/App/CapApp-SPM/Package.swift"
          if ! grep -q "GoogleSignIn-iOS" "$PKG"; then
            python3 -c "
          path = '$PKG'
          with open(path) as f:
              content = f.read()
          content = content.replace(
              '.package(name: \"CapacitorSecureStoragePlugin\", path: \"../../../node_modules/capacitor-secure-storage-plugin\")',
              '.package(name: \"CapacitorSecureStoragePlugin\", path: \"../../../node_modules/capacitor-secure-storage-plugin\"),\n        .package(url: \"https://github.com/google/GoogleSignIn-iOS.git\", from: \"8.0.0\")',
          )
          content = content.replace(
              '.product(name: \"CapacitorSecureStoragePlugin\", package: \"CapacitorSecureStoragePlugin\")',
              '.product(name: \"CapacitorSecureStoragePlugin\", package: \"CapacitorSecureStoragePlugin\"),\n                .product(name: \"GoogleSignIn\", package: \"GoogleSignIn-iOS\")',
          )
          with open(path, 'w') as f:
              f.write(content)
          "
          fi
      - name: Fetch signing files
        # Uses the budder_buddy_admin integration (Admin access) to fetch an
        # existing App Store distribution cert+profile for this bundle ID,
        # or create one if none exists yet (--create). The declarative
        # `ios_signing:` block tried before this does NOT do this - it only
        # checks for profiles already manually uploaded to Codemagic's own
        # Code Signing Identities page, which is why it failed instantly
        # with "No matching profiles found" before any script even ran.
        #
        # --create alone still fails with "Cannot save Signing Certificates
        # without certificate private key" - it needs an explicit private
        # key to pair with the new certificate's CSR, which it does not
        # generate on its own. FCI_CERTIFICATE_PRIVATE_KEY (base64-encoded
        # RSA key, set as a secure env var in the budder_buddy_env group) is
        # decoded to a file and passed via --certificate-key so the new
        # certificate this step creates actually has a usable private key.
        script: |
          set -e
          CERT_KEY_PATH="$CM_BUILD_DIR/cert_key.pem"
          echo "$FCI_CERTIFICATE_PRIVATE_KEY" | base64 -d > "$CERT_KEY_PATH"

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:"$CERT_KEY_PATH"
      - name: Set up signing certificate
        # keychain add-certificates alone left the imported key without
        # `codesign` in its ACL partition list, so the archive step failed
        # with "errSecInternalComponent" the moment Xcode's parallel build
        # tried to actually use the key to sign a resource bundle (macOS
        # keychain asking for non-interactive codesign access it was never
        # granted - a well-documented CI code-signing gotcha, not specific
        # to this app). Explicitly granting codesign access after import
        # fixes it; the exact pattern Codemagic's own real-world yaml
        # examples use (github.com/BasedHardware/omi/blob/main/codemagic.yaml).
        script: |
          keychain add-certificates
          KEYCHAIN_PATH=$(keychain get-default)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH" 2>/dev/null || true
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - dreamtattoocompany@gmail.com
