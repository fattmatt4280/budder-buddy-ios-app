workflows:
  ios-testflight:
    name: Budder Buddy iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name this exactly as you name the App Store Connect API key
      # integration when you add it under Codemagic > Team settings >
      # Integrations > App Store Connect.
      app_store_connect: budder_buddy_asc_api_key
    environment:
      # Create this group under the app's Environment variables in Codemagic
      # and add VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY to it
      # (values from this repo's .env - they're the public/anon keys, safe
      # to build in, but keeping them out of this committed file anyway).
      groups:
        - budder_buddy_env
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcodeproj/project.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bluedreambudder.budder-buddy"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bluedreambudder.budder-buddy
      node: 20
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up automatic code signing
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - dreamtattoocompany@gmail.com
