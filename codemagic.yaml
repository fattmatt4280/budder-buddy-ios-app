workflows:
  ios-testflight:
    name: Budder Buddy iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # This is the key Matt named "magiccode" in App Store Connect (Admin
      # access, Key ID BHNKDRCGAP) - but it was already registered in
      # Codemagic under "budder buddy api" from an earlier attempt, so
      # that's the integration name Codemagic actually knows it by.
      app_store_connect: "budder buddy api"
    environment:
      # Create this group under the app's Environment variables in Codemagic
      # and add VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY to it
      # (values from this repo's .env - they're the public/anon keys, safe
      # to build in, but keeping them out of this committed file anyway).
      groups:
        - budder_buddy_env
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcodeproj/project.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.bluedreambudder.budder-buddy"
      node: 20
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Fetch signing files
        # Uses the "budder buddy api" integration (Admin access) to fetch an
        # existing App Store distribution cert+profile for this bundle ID,
        # or create one if none exists yet (--create). The declarative
        # `ios_signing:` block tried before this does NOT do this - it only
        # checks for profiles already manually uploaded to Codemagic's own
        # Code Signing Identities page, which is why it failed instantly
        # with "No matching profiles found" before any script even ran.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - dreamtattoocompany@gmail.com
